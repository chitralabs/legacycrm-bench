# Meridian CRM 4.2 integration endpoints (synthetic legacy artifact)
# auth secret values are vault references; literal credentials never appear in config.

[erp_orders]
url = https://erp.example.internal/api/orders
auth = basic:vault://meridian/erp_user
retry = 3
timeout_ms = 30000
payload = fixed_width
layout = EXPORT_ORD

[dw_accounts]
url = https://dw.example.internal/load/accounts
auth = apikey:vault://meridian/dw_key
retry = 1
timeout_ms = 60000
payload = fixed_width
layout = EXPORT_ACCT

[notifier]
url = https://notify.example.internal/send
auth = none
retry = 0
timeout_ms = 5000
payload = xml

[marketing_sync]
url = https://mkt.example.internal/contacts
auth = apikey:vault://meridian/mkt_key
retry = 2
timeout_ms = 15000
payload = csv
