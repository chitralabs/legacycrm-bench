# Meridian CRM 4.2 nightly batch schedule (synthetic legacy artifact; semantics in SYSTEM_OVERVIEW.md §7)
JOB integrity_check AT 01:00 RUN integrity_check.crms ON_ERROR CONTINUE
JOB credit_hold_sweep AT 01:30 RUN credit_hold_sweep.crms ON_ERROR ABORT
JOB order_totals AT 02:00 RUN order_totals.crms ON_ERROR RETRY:2
JOB case_escalation AT 02:30 RUN case_escalation.crms ON_ERROR CONTINUE
JOB dw_export AT 03:00 RUN dw_export.crms ON_ERROR RETRY:1
